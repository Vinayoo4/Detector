<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if page_title %}{{ page_title }} — {% endif %}{{ app_name }}</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="stylesheet" href="/static/css/app.css">
    <meta name="theme-color" content="#0b1220">
</head>
<body>
    <header class="navbar">
        <div class="container nav-content">
            <a href="/" class="brand">Detector</a>
            <button id="theme-toggle" class="btn-theme" aria-label="Toggle theme">Toggle Theme</button>
        </div>
    </header>
    <main class="container main-content">
        {% block content %}{% endblock %}
    </main>
    <footer class="footer">
        <div class="container">
            <p>Detector — Local fake website scanner</p>
            <div class="footer-links">
                <a href="#">Disclaimer</a> |
                <a href="#">Privacy</a> |
                <a href="#">Terms</a>
            </div>
        </div>
    </footer>
    <script src="/static/js/app.js"></script>
</body>
</html>
